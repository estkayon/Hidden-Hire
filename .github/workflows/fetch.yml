name: Fetch jobs

on:
  schedule:
    - cron: "17 */3 * * *"  # every 3 hours at minute 17 (UTC)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fetch
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run fetcher
        env:
          REED_API_KEY: ${{ secrets.REED_API_KEY }}
        run: python -m fetcher.run --out data

      - name: Show health report
        run: cat data/health/latest.json