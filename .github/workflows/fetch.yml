name: Fetch jobs

on:
  schedule:
    - cron: "17 * * * *"  # hourly at minute 17 (UTC); GitHub delays or skips many scheduled runs
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fetch
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check out data repo
        uses: actions/checkout@v4
        with:
          repository: estkayon/hidden-hire-data
          token: ${{ secrets.DATA_REPO_TOKEN }}
          path: data-repo

      - name: Run fetcher
        env:
          REED_API_KEY: ${{ secrets.REED_API_KEY }}
        run: python -m fetcher.run --out data-repo

      - name: Show health report
        run: cat data-repo/health/latest.json

      - name: Push new data
        working-directory: data-repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No new data"
          else
            git commit -m "data: fetch $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi