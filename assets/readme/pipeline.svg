<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-label="How it works: GitHub Actions fetches jobs every 3 hours into a public data repo; your PC syncs, scores and builds CVs locally; a local fetch is the backup">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f2a33"/>
      <stop offset="1" stop-color="#204654"/>
    </linearGradient>
    <clipPath id="frame"><rect width="1200" height="380" rx="24"/></clipPath>
  </defs>
  <style>
    text { font-family: "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif; }
    .dash { stroke-dasharray: 8 10; animation: dash 1.2s linear infinite; }
    .dashSlow { stroke-dasharray: 6 10; animation: dash 2s linear infinite; }
    .node { animation: rise 0.8s ease-out backwards; }
    .n1 { animation-delay: 0.1s; } .n2 { animation-delay: 0.4s; } .n3 { animation-delay: 0.7s; } .n4 { animation-delay: 1s; }
    .halo { opacity: 0; animation: halo 2.8s ease-out infinite; transform-box: fill-box; transform-origin: center; }
    .h2 { animation-delay: 0.9s; } .h3 { animation-delay: 1.8s; }
    .spin { animation: spin 6s linear infinite; transform-box: fill-box; transform-origin: center; }
    .packet { animation: pulse 1.6s ease-in-out infinite; }
    @keyframes dash { to { stroke-dashoffset: -36; } }
    @keyframes rise { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes halo { 0% { transform: scale(1); opacity: 0.6; } 100% { transform: scale(1.12, 1.25); opacity: 0; } }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
  </style>

  <g clip-path="url(#frame)">
    <rect width="1200" height="380" fill="url(#bg)"/>
    <text x="60" y="58" font-size="15" font-weight="700" letter-spacing="2.5" fill="#CAFFA6">HOW IT WORKS</text>

    <!-- connectors -->
    <path d="M330 175 H470" stroke="#CAFFA6" stroke-opacity="0.8" stroke-width="3" fill="none" class="dash"/>
    <path d="M730 175 H870" stroke="#CAFFA6" stroke-opacity="0.8" stroke-width="3" fill="none" class="dash"/>
    <path d="M1000 300 V245" stroke="#F7F9E1" stroke-opacity="0.45" stroke-width="2.5" fill="none" class="dashSlow"/>

    <!-- moving packets -->
    <circle r="6" fill="#CAFFA6" class="packet"><animateMotion dur="2.2s" repeatCount="indefinite" path="M330 175 H470"/></circle>
    <circle r="6" fill="#CAFFA6" class="packet"><animateMotion dur="2.2s" begin="1.1s" repeatCount="indefinite" path="M730 175 H870"/></circle>

    <!-- Node 1: GitHub Actions -->
    <g class="node n1">
      <rect class="halo" x="70" y="105" width="260" height="140" rx="20" fill="none" stroke="#A9E0F1" stroke-width="2"/>
      <rect x="70" y="105" width="260" height="140" rx="20" fill="#F7F9E1" fill-opacity="0.07" stroke="#A9E0F1" stroke-opacity="0.45"/>
      <g transform="translate(110,152)">
        <circle cx="0" cy="0" r="22" fill="#A9E0F1" fill-opacity="0.18"/>
        <g class="spin">
          <circle cx="0" cy="0" r="12" fill="none" stroke="#A9E0F1" stroke-width="3" stroke-dasharray="7 5"/>
        </g>
        <circle cx="0" cy="0" r="4" fill="#A9E0F1"/>
      </g>
      <text x="146" y="149" font-size="19" font-weight="700" fill="#F7F9E1">GitHub Actions</text>
      <text x="146" y="172" font-size="14" fill="#F7F9E1" fill-opacity="0.7">every 3 hours, in the cloud</text>
      <text x="92" y="214" font-size="14" fill="#F7F9E1" fill-opacity="0.85">Fetch · filter · dedup</text>
    </g>

    <!-- Node 2: Data repo -->
    <g class="node n2">
      <rect class="halo h2" x="470" y="105" width="260" height="140" rx="20" fill="none" stroke="#CAFFA6" stroke-width="2"/>
      <rect x="470" y="105" width="260" height="140" rx="20" fill="#F7F9E1" fill-opacity="0.07" stroke="#CAFFA6" stroke-opacity="0.45"/>
      <g transform="translate(510,152)">
        <circle r="22" fill="#CAFFA6" fill-opacity="0.16"/>
        <rect x="-10" y="-12" width="20" height="5" rx="2" fill="#CAFFA6"/>
        <rect x="-10" y="-3" width="20" height="5" rx="2" fill="#CAFFA6" fill-opacity="0.7"/>
        <rect x="-10" y="6" width="20" height="5" rx="2" fill="#CAFFA6" fill-opacity="0.45"/>
      </g>
      <text x="546" y="149" font-size="19" font-weight="700" fill="#F7F9E1">Public data repo</text>
      <text x="546" y="172" font-size="14" fill="#F7F9E1" fill-opacity="0.7">job posts only</text>
      <text x="492" y="214" font-size="14" fill="#F7F9E1" fill-opacity="0.85">Daily JSONL · no personal data</text>
    </g>

    <!-- Node 3: Your PC -->
    <g class="node n3">
      <rect class="halo h3" x="870" y="105" width="270" height="140" rx="20" fill="none" stroke="#F7F9E1" stroke-width="2"/>
      <rect x="870" y="105" width="270" height="140" rx="20" fill="#F7F9E1"/>
      <g transform="translate(910,152)">
        <circle r="22" fill="#204654" fill-opacity="0.12"/>
        <rect x="-12" y="-10" width="24" height="16" rx="3" fill="none" stroke="#204654" stroke-width="2.5"/>
        <rect x="-6" y="9" width="12" height="3" rx="1.5" fill="#204654"/>
      </g>
      <text x="946" y="149" font-size="19" font-weight="800" fill="#204654">Your PC</text>
      <text x="946" y="172" font-size="14" fill="#204654" fill-opacity="0.75">127.0.0.1 only</text>
      <text x="892" y="214" font-size="14" font-weight="600" fill="#204654">Sync · score · CV · tracker</text>
    </g>

    <!-- Node 4: local fetch backup -->
    <g class="node n4">
      <rect x="880" y="300" width="250" height="50" rx="14" fill="none" stroke="#F7F9E1" stroke-opacity="0.45" stroke-dasharray="5 6"/>
      <text x="1005" y="331" font-size="14" fill="#F7F9E1" fill-opacity="0.85" text-anchor="middle">Backup: local fetch on your PC</text>
    </g>

    <text x="60" y="320" font-size="14" fill="#F7F9E1" fill-opacity="0.65">Your CV, profile, scores and applications stay on your PC.</text>
    <text x="60" y="342" font-size="14" fill="#F7F9E1" fill-opacity="0.65">Only text you send to your chosen LLM provider leaves it.</text>
  </g>
</svg>
