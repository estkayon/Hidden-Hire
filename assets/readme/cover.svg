<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-label="Hidden Hire: local-first AI job search agent">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d242c"/>
      <stop offset="0.55" stop-color="#173843"/>
      <stop offset="1" stop-color="#204654"/>
    </linearGradient>
    <radialGradient id="glowSky" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#A9E0F1" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#A9E0F1" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowMeadow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#CAFFA6" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#CAFFA6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#F7F9E1" fill-opacity="0.07"/>
    </pattern>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#CAFFA6"/>
      <stop offset="0.5" stop-color="#A9E0F1"/>
      <stop offset="1" stop-color="#CAFFA6"/>
    </linearGradient>
    <clipPath id="frame"><rect width="1200" height="420" rx="24"/></clipPath>
  </defs>
  <style>
    text { font-family: "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif; }
    .mono { font-family: "Cascadia Code", Consolas, "SFMono-Regular", Menlo, monospace; }
    .drift1 { animation: drift1 14s ease-in-out infinite alternate; }
    .drift2 { animation: drift2 18s ease-in-out infinite alternate; }
    .rise { animation: rise 0.9s ease-out backwards; }
    .d1 { animation-delay: 0.1s; } .d2 { animation-delay: 0.35s; } .d3 { animation-delay: 0.6s; } .d4 { animation-delay: 0.85s; }
    .float1 { animation: float 6s ease-in-out infinite; }
    .float2 { animation: float 7s ease-in-out -2s infinite; }
    .float3 { animation: float 8s ease-in-out -4s infinite; }
    .ring { stroke-dasharray: 251.3; stroke-dashoffset: 45.2; animation: fill 2.4s 0.9s cubic-bezier(.2,.8,.2,1) backwards, pulse 3s 3.4s ease-in-out infinite; }
    .cursor { animation: blink 1s steps(1) infinite; }
    .scan { animation: scan 5s linear infinite; }
    .chip { animation: chip 4s ease-in-out infinite; }
    @keyframes drift1 { from { transform: translate(0, 0); } to { transform: translate(90px, 40px); } }
    @keyframes drift2 { from { transform: translate(0, 0); } to { transform: translate(-80px, -30px); } }
    @keyframes rise { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
    @keyframes fill { from { stroke-dashoffset: 251.3; } to { stroke-dashoffset: 45.2; } }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.65; } }
    @keyframes blink { 50% { opacity: 0; } }
    @keyframes scan { from { transform: translateX(-260px); } to { transform: translateX(1460px); } }
    @keyframes chip { 0%, 100% { opacity: 0.55; } 50% { opacity: 1; } }
  </style>

  <g clip-path="url(#frame)">
    <rect width="1200" height="420" fill="url(#bg)"/>
    <rect width="1200" height="420" fill="url(#dots)"/>
    <circle class="drift1" cx="980" cy="70" r="260" fill="url(#glowSky)"/>
    <circle class="drift2" cx="160" cy="380" r="240" fill="url(#glowMeadow)"/>
    <g class="scan"><rect x="0" y="0" width="160" height="420" fill="#F7F9E1" fill-opacity="0.04" transform="skewX(-20)"/></g>

    <!-- Left: title block -->
    <g class="rise d1">
      <rect x="72" y="88" width="340" height="30" rx="15" fill="#CAFFA6" fill-opacity="0.12" stroke="#CAFFA6" stroke-opacity="0.4"/>
      <circle cx="92" cy="103" r="5" fill="#CAFFA6"><animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/></circle>
      <text x="106" y="108" font-size="14" font-weight="600" letter-spacing="2" fill="#CAFFA6">LOCAL-FIRST · AI · BANGLADESH</text>
    </g>
    <text class="rise d2" x="70" y="196" font-size="76" font-weight="800" fill="#F7F9E1" letter-spacing="-1.5">Hidden <tspan fill="url(#shine)">Hire</tspan></text>
    <text class="rise d3" x="74" y="240" font-size="22" fill="#F7F9E1" fill-opacity="0.82">Tech jobs beyond the crowded boards,</text>
    <text class="rise d3" x="74" y="270" font-size="22" fill="#F7F9E1" fill-opacity="0.82">matched to your CV. You apply yourself.</text>

    <g class="rise d4">
      <rect x="72" y="306" width="360" height="44" rx="10" fill="#0b1e24" fill-opacity="0.7" stroke="#A9E0F1" stroke-opacity="0.25"/>
      <text x="92" y="334" font-size="17" class="mono" fill="#CAFFA6">$</text>
      <clipPath id="typeClip"><rect x="110" y="312" width="192" height="32"><animate attributeName="width" from="0" to="192" begin="1.2s" dur="2.4s" fill="freeze"/></rect></clipPath>
      <text x="112" y="334" font-size="17" class="mono" fill="#F7F9E1" clip-path="url(#typeClip)">python -m app.sync</text>
      <rect class="cursor" x="304" y="319" width="9" height="20" fill="#A9E0F1"><animate attributeName="x" from="112" to="304" begin="1.2s" dur="2.4s" fill="freeze"/></rect>
    </g>

    <!-- Right: floating job cards -->
    <g class="float3" transform="translate(0,0)">
      <g transform="translate(700,250) rotate(-4)">
        <rect width="330" height="120" rx="18" fill="#F7F9E1" fill-opacity="0.08" stroke="#F7F9E1" stroke-opacity="0.18"/>
        <rect x="24" y="28" width="150" height="12" rx="6" fill="#F7F9E1" fill-opacity="0.35"/>
        <rect x="24" y="52" width="210" height="9" rx="4.5" fill="#F7F9E1" fill-opacity="0.18"/>
        <rect x="24" y="72" width="170" height="9" rx="4.5" fill="#F7F9E1" fill-opacity="0.18"/>
      </g>
    </g>
    <g class="float2">
      <g transform="translate(760,170) rotate(3)">
        <rect width="330" height="120" rx="18" fill="#F7F9E1" fill-opacity="0.11" stroke="#A9E0F1" stroke-opacity="0.3"/>
        <rect x="24" y="28" width="180" height="12" rx="6" fill="#F7F9E1" fill-opacity="0.4"/>
        <rect x="24" y="52" width="230" height="9" rx="4.5" fill="#F7F9E1" fill-opacity="0.2"/>
        <rect x="24" y="72" width="140" height="9" rx="4.5" fill="#F7F9E1" fill-opacity="0.2"/>
      </g>
    </g>
    <g class="float1">
      <g transform="translate(690,70)">
        <rect width="400" height="150" rx="20" fill="#F7F9E1"/>
        <rect x="26" y="30" width="190" height="16" rx="8" fill="#204654"/>
        <rect x="26" y="58" width="130" height="11" rx="5.5" fill="#204654" fill-opacity="0.35"/>
        <g class="chip"><rect x="26" y="88" width="78" height="26" rx="13" fill="#CAFFA6"/><text x="65" y="106" font-size="13" font-weight="700" fill="#204654" text-anchor="middle">Remote</text></g>
        <rect x="112" y="88" width="72" height="26" rx="13" fill="#A9E0F1"/><text x="148" y="106" font-size="13" font-weight="700" fill="#204654" text-anchor="middle">Dhaka</text>
        <g transform="translate(330,75)">
          <circle r="40" fill="none" stroke="#204654" stroke-opacity="0.12" stroke-width="9"/>
          <circle class="ring" r="40" fill="none" stroke="#3aa65a" stroke-width="9" stroke-linecap="round" transform="rotate(-90)"/>
          <text y="7" font-size="21" font-weight="800" fill="#204654" text-anchor="middle">82%</text>
        </g>
      </g>
    </g>
  </g>
</svg>
