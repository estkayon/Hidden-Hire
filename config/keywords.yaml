# All matching is case-insensitive and on whole words.

# Search terms for sources that need a query (country boards, Adzuna, Reed).
search_queries:
  - Machine Learning
  - Data Scientist
  - Data Engineer
  - Data Analyst
  - Software Engineer
  - Backend Developer
  - DevOps
  - Python

# Title must contain at least one of these to count as a tech job.
tech_titles:
  - ai
  - artificial intelligence
  - machine learning
  - ml
  - mlops
  - llm
  - deep learning
  - nlp
  - computer vision
  - data scientist
  - data science
  - data engineer
  - data engineering
  - data analyst
  - analytics engineer
  - research engineer
  - research scientist
  - applied scientist
  - software engineer
  - software developer
  - developer
  - programmer
  - backend
  - back-end
  - frontend
  - front-end
  - full stack
  - full-stack
  - fullstack
  - web developer
  - python
  - devops
  - sre
  - site reliability
  - cloud
  - platform engineer
  - infrastructure engineer

# Title containing any of these is dropped, even if it matched above.
exclude_titles:
  - sales
  - account executive
  - account manager
  - recruiter
  - recruiting
  - talent
  - marketing
  - renewals
  - customer success
  - legal
  - counsel
  - finance
  - accountant
  - payroll
  - benefits
  - human resources
  - executive assistant

# Onsite/hybrid jobs outside Bangladesh are dropped when the title or
# description contains any of these. Remote jobs are always kept.
eligibility_blockers:
  - no visa sponsorship
  - visa sponsorship is not available
  - sponsorship is not available
  - sponsorship not available
  - without sponsorship
  - without visa sponsorship
  - unable to sponsor
  - not able to sponsor
  - cannot sponsor
  - can't sponsor
  - will not sponsor
  - won't sponsor
  - do not sponsor
  - does not sponsor
  - do not offer visa sponsorship
  - does not offer visa sponsorship
  - must have the right to work
  - must have right to work
  - must already have the right to work
  - must be authorized to work
  - must be legally authorized to work
  - must be eligible to work in
  - citizens only
  - citizenship is required
  - must be a us citizen
  - must be a u.s. citizen
  - must be a citizen
  - security clearance
  - permanent residents only
  - eu work permit required
  - valid work permit required

# Level shown on the card, only when the posting states it. First match wins.
seniority_levels:
  Intern: [intern, internship, trainee, working student, werkstudent]
  Junior: [junior, jr, entry level, entry-level, graduate, associate, fresher]
  Mid-level: [mid, mid level, mid-level, intermediate]
  Senior: [senior, sr, lead, staff, principal]

# Roles clearly above intern/junior/mid level are dropped.
senior_titles:
  - senior
  - sr
  - staff
  - principal
  - lead
  - head
  - director
  - vp
  - vice president
  - chief
  - manager