# Copy to config/settings.yaml (git-ignored) to change models.
# Model strings use LiteLLM's "provider/model" format; API keys come from .env.
llm:
  timeout_seconds: 60
  scoring:
    model: groq/openai/gpt-oss-20b
    max_tokens: 900
    reasoning_effort: low
    pause_seconds: 30 # Groq free tier: 8K tokens per minute for this model
  documents:
    model: groq/openai/gpt-oss-120b
    max_tokens: 3000
    reasoning_effort: low